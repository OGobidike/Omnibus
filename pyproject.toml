[project]
name = "omnibus"
version = "0.1.0"
description = "A polite storytelling companion built on Claude, who never passes off a tall tale as history."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.8,<3",
    "python-dotenv>=1.0",
]

[project.scripts]
omnibus = "omnibus.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omnibus"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
